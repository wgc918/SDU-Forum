; SDU-Forum 集成测试配置
; 仅密码/密钥类字段支持 ${VAR} 环境变量展开，其余字段直接读取 INI 值。
; 安全约束：表名必须全部以 it_ 开头；Redis db 必须 >= 1。

[server]
address = 127.0.0.1
port = 18080
thread_num = 2

[log]
level = warn
file = build/reports/it-server.log
console = false
max_lines = 20000

[database]
host = 127.0.0.1
port = 3306
user = wgc
password = ${SDU_IT_DB_PASSWORD:-123456}
dbname = testdb
pool_min = 1
pool_max = 4
max_idle_time = 30
connection_timeout_ms = 3000
op_num = 1

[redis]
host = 127.0.0.1
port = 6379
password = ${SDU_IT_REDIS_PASSWORD:-}
db = 15

[jwt]
issuer = SDU_Forum_IT
access_jwt_secret = ${SDU_IT_ACCESS_JWT_SECRET:-it-access-secret-integration}
refresh_jwt_secret = ${SDU_IT_REFRESH_JWT_SECRET:-it-refresh-secret-integration}
admin_access_jwt_secret = ${SDU_IT_ADMIN_ACCESS_JWT_SECRET:-it-admin-access-secret-integration}
admin_refresh_jwt_secret = ${SDU_IT_ADMIN_REFRESH_JWT_SECRET:-it-admin-refresh-secret-integration}
hash_secret = ${SDU_IT_HASH_SECRET:-it-hash-secret-integration}
# 单位 分钟
access_token_ttl = 60
# 单位 小时
refresh_token_ttl = 168

[tables]
account_table = it_account
blacklist_table = it_blacklist
refresh_token_table = it_refresh_tokens
admin_account_table = it_admin_account
