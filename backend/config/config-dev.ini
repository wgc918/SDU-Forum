# =============================================================================
# 开发环境配置
#
# 启动时可通过环境变量 SDU_FORUM_CONFIG 指定配置文件，或通过命令行参数：
#   ./sdu_forum_server config/config-dev.ini
#
# 配置值支持环境变量展开：
#   ${VAR}            -> 读取环境变量 VAR
#   ${VAR:-default}   -> 环境变量不存在时使用 default
# =============================================================================

[server]
address = 0.0.0.0
port = 8080
thread_num = 4

[log]
level = INFO
file = ../logs/server.log
console = true
max_lines = 100000

[database]
host = 127.0.0.1
port = 3306
user = wgc
password = ${SDU_DB_PASSWORD:-123456}
dbname = testdb
pool_min = 5
pool_max = 30
max_idle_time = 300
connection_timeout_ms = 3000
op_num = 4

[redis]
host = 127.0.0.1
port = 6379
password = ${SDU_REDIS_PASSWORD:-123456}
db = 0

[jwt]
issuer = SDU_Forum
access_jwt_secret = ${SDU_ACCESS_JWT_SECRET:-dev_access_secret_change_me}
refresh_jwt_secret = ${SDU_REFRESH_JWT_SECRET:-dev_refresh_secret_change_me}
admin_access_jwt_secret = ${SDU_ACCESS_JWT_SECRET:-dev_admin_access_secret_change_me}
admin_refresh_jwt_secret = ${SDU_REFRESH_JWT_SECRET:-dev_admin_refresh_secret_change_me}
hash_secret = ${SDU_HASH_SECRET:-dfacadgafeqwfqvab}
# 单位 分钟
access_token_ttl = 60
# 单位 小时
refresh_token_ttl = 168

[tables]
account_table = account
blacklist_table = blacklist
admin_account_table = admin_account
refresh_token_table = refresh_tokens
