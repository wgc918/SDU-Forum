<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户反馈 · SDU Forum Admin</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main data-page="feedback">
    <!--
      ======================================================================
      页面：用户反馈
      ----------------------------------------------------------------------
      数据字段（FEEDBACKS）：
        id / userId / userName / type(bug|feature|experience|other) /
        title / content / contact / status(pending|processing|resolved) /
        reply / handler / createdAt
      关联数据：USERS（学号、学院）
      页面派生：附件缩略图（按反馈 ID 生成）、处理记录时间线
      ----------------------------------------------------------------------
      后端接口草案：
        GET    /api/admin/feedbacks?status=
        GET    /api/admin/feedbacks/{id}
        POST   /api/admin/feedbacks/{id}/reply   { reply, status }
        PATCH  /api/admin/feedbacks/{id}         { status }
      ======================================================================
    -->
    <div class="page-head">
      <div class="page-head-titles">
        <h1 class="page-title">用户反馈</h1>
        <p class="page-desc">查看用户提交的问题与建议，记录处理过程并回复用户</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-primary" id="refresh-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          刷新反馈
        </button>
      </div>
    </div>

    <div class="card filter-card" style="align-items:center">
      <div class="chips" id="feedback-chips"></div>
    </div>

    <div class="feedback-layout">
      <div class="card feedback-list-card">
        <div class="feedback-list-head" id="feedback-total">共 0 条反馈</div>
        <div class="feedback-list" id="feedback-list"></div>
      </div>

      <div class="card" id="feedback-detail"></div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/mock.js"></script>
  <script>
    (function () {
      'use strict';

      const App = window.App;
      App.renderLayout('feedbacks');

      const $ = App.$;
      const esc = App.escapeHtml;
      const FEEDBACKS = window.FEEDBACKS;
      const USERS = window.USERS;

      const TYPE_META = {
        bug: { label: '功能异常', tone: 'danger' },
        feature: { label: '功能建议', tone: 'info' },
        experience: { label: '体验问题', tone: 'warning' },
        other: { label: '其他反馈', tone: 'neutral' }
      };

      const STATUS_META = {
        pending: { label: '待处理', tone: 'warning' },
        processing: { label: '处理中', tone: 'info' },
        resolved: { label: '已处理', tone: 'success' }
      };

      const state = {
        status: '',
        selectedId: null
      };

      function userOf(feedback) {
        return USERS.find(function (user) { return user.id === feedback.userId; });
      }

      function getFiltered() {
        return FEEDBACKS.filter(function (feedback) {
          return !state.status || feedback.status === state.status;
        }).sort(function (a, b) { return b.createdAt - a.createdAt; });
      }

      function currentFeedback(rows) {
        const list = rows || getFiltered();
        let item = list.find(function (feedback) { return feedback.id === state.selectedId; });
        if (!item) {
          item = list[0] || null;
          state.selectedId = item ? item.id : null;
        }
        return item;
      }

      function typePill(feedback) {
        const meta = TYPE_META[feedback.type] || TYPE_META.other;
        return App.pill(meta.label, meta.tone);
      }

      function statusPill(feedback) {
        const meta = STATUS_META[feedback.status] || STATUS_META.pending;
        return App.pill(meta.label, meta.tone, feedback.status === 'pending');
      }

      /* ---------------------------------------------------------------
         状态筛选
         --------------------------------------------------------------- */
      function renderChips() {
        const counts = {
          '': FEEDBACKS.length,
          pending: FEEDBACKS.filter(function (f) { return f.status === 'pending'; }).length,
          processing: FEEDBACKS.filter(function (f) { return f.status === 'processing'; }).length,
          resolved: FEEDBACKS.filter(function (f) { return f.status === 'resolved'; }).length
        };
        const options = [
          { value: '', label: '全部' },
          { value: 'pending', label: '待处理' },
          { value: 'processing', label: '处理中' },
          { value: 'resolved', label: '已处理' }
        ];
        $('#feedback-chips').innerHTML = options.map(function (option) {
          return '<button type="button" class="chip' + (state.status === option.value ? ' active' : '') +
            '" data-status="' + option.value + '">' + option.label +
            '<span class="chip-count">' + counts[option.value] + '</span></button>';
        }).join('');
      }

      /* ---------------------------------------------------------------
         左侧列表
         --------------------------------------------------------------- */
      function renderList(rows) {
        $('#feedback-total').textContent = '共 ' + rows.length + ' 条反馈 · 待处理 ' +
          rows.filter(function (f) { return f.status === 'pending'; }).length + ' 条';

        $('#feedback-list').innerHTML = rows.length
          ? rows.map(function (feedback) {
              const user = userOf(feedback);
              return '<div class="feedback-card' + (feedback.id === state.selectedId ? ' active' : '') +
                '" data-id="' + feedback.id + '">' +
                '<div class="feedback-card-top">' + typePill(feedback) + statusPill(feedback) + '</div>' +
                '<div class="feedback-card-title">' + esc(feedback.title) + '</div>' +
                '<div class="feedback-card-meta"><span>' + esc(user ? user.studentId : '—') + '</span><span>·</span>' +
                '<span>' + App.fmtRelative(feedback.createdAt) + '</span></div></div>';
            }).join('')
          : App.emptyHTML('没有匹配的反馈', '请切换状态筛选后重试', 'lightbulb');
      }

      /* ---------------------------------------------------------------
         右侧详情
         --------------------------------------------------------------- */
      function attachmentsHTML(feedback) {
        const num = parseInt(feedback.id.slice(1), 10) || 1;
        const count = 2 + num % 3;
        let html = '';
        for (let i = 0; i < count; i++) {
          html += '<div class="attachment-thumb tone-' + ((num + i) % 4 + 1) + '" title="附件 ' + (i + 1) + '">' +
            App.icon('image', 20) + '</div>';
        }
        return '<div class="attachment-grid">' + html + '</div>';
      }

      function timelineHTML(feedback) {
        const at = function (hours) {
          return App.fmtDateTime(Math.min(feedback.createdAt + hours * 3600000, Date.now()));
        };
        const items = [{
          time: App.fmtDateTime(feedback.createdAt),
          text: '<b>' + esc(feedback.userName) + '</b> 提交了「' + esc((TYPE_META[feedback.type] || TYPE_META.other).label) + '」',
          tone: ''
        }];

        if (feedback.status !== 'pending') {
          items.push({
            time: at(2),
            text: '<b>' + esc(feedback.handler || '客服专员') + '</b> 受理了该反馈',
            tone: 'warning'
          });
        }

        if (feedback.reply) {
          items.push({
            time: at(26),
            text: '<b>' + esc(feedback.handler || '超级管理员') + '</b> 回复：' + esc(feedback.reply),
            tone: 'success'
          });
        }

        if (feedback.status === 'resolved') {
          items.push({
            time: at(30),
            text: '反馈已标记为已处理',
            tone: 'success'
          });
        }

        return '<div class="timeline">' + items.map(function (item) {
          return '<div class="tl-item' + (item.tone ? ' ' + item.tone : '') + '">' +
            '<span class="tl-dot"></span><div class="tl-time">' + esc(item.time) + '</div>' +
            '<div class="tl-text">' + item.text + '</div></div>';
        }).join('') + '</div>';
      }

      function renderDetail(feedback) {
        const mount = $('#feedback-detail');
        if (!feedback) {
          mount.innerHTML = '<div class="card-body">' + App.emptyHTML('请选择一条反馈', '从左侧列表中选择反馈查看详情', 'lightbulb') + '</div>';
          return;
        }

        const user = userOf(feedback);
        mount.innerHTML = '<div class="card-body">' +
          '<div class="feedback-detail-head">' +
          '<div style="min-width:0"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
          typePill(feedback) + statusPill(feedback) + '</div>' +
          '<div class="feedback-detail-title">' + esc(feedback.title) + '</div>' +
          '<div class="feedback-detail-meta">' +
          (user ? App.avatarHTML(user.nickname, user.id, 24) + '<span>' + esc(user.nickname) + '</span><span>' + esc(user.studentId) + '</span>' : '') +
          '<span>' + App.fmtDateTime(feedback.createdAt) + '</span>' +
          '<span>FID ' + feedback.id.toUpperCase() + '</span></div></div>' +
          '<div class="text-sm muted-3" style="white-space:nowrap">' + (feedback.contact ? '联系方式：' + esc(feedback.contact) : '未留联系方式') + '</div>' +
          '</div>' +

          '<div class="section-title">反馈正文</div>' +
          '<div class="feedback-body">' + esc(feedback.content) + '</div>' +

          '<div class="section-title">附件 <span class="count">' + (2 + (parseInt(feedback.id.slice(1), 10) || 1) % 3) + ' 张</span></div>' +
          attachmentsHTML(feedback) +

          '<div class="section-title">处理记录</div>' +
          timelineHTML(feedback) +

          '<div class="section-title">回复与状态</div>' +
          '<div class="feedback-reply">' +
          '<div class="field"><label class="label" for="feedback-status">处理状态</label>' +
          '<select class="select" id="feedback-status" style="max-width:200px">' +
          '<option value="pending"' + (feedback.status === 'pending' ? ' selected' : '') + '>待处理</option>' +
          '<option value="processing"' + (feedback.status === 'processing' ? ' selected' : '') + '>处理中</option>' +
          '<option value="resolved"' + (feedback.status === 'resolved' ? ' selected' : '') + '>已处理</option>' +
          '</select></div>' +
          '<div class="field" style="margin-top:12px"><label class="label" for="feedback-reply-text">回复内容</label>' +
          '<textarea class="control" id="feedback-reply-text" rows="4" placeholder="填写给用户的回复，提交后会同步到反馈记录">' +
          esc(feedback.reply || '') + '</textarea></div>' +
          '<div class="feedback-actions">' +
          '<button type="button" class="btn btn-secondary" id="feedback-cancel">重置</button>' +
          '<button type="button" class="btn btn-primary" id="feedback-submit">提交回复</button>' +
          '</div></div></div>';

        const submit = function () {
          const nextStatus = $('#feedback-status').value;
          const reply = $('#feedback-reply-text').value.trim();
          if (nextStatus === 'resolved' && !reply) {
            App.toast('标记已处理前请填写回复内容', 'warning');
            return;
          }
          feedback.status = nextStatus;
          feedback.reply = reply;
          feedback.handler = '超级管理员';
          App.toast('反馈已更新并回复用户', 'success');
          renderAll();
        };

        $('#feedback-submit').addEventListener('click', submit);
        $('#feedback-cancel').addEventListener('click', function () {
          $('#feedback-status').value = feedback.status;
          $('#feedback-reply-text').value = feedback.reply || '';
        });
      }

      function renderAll() {
        const rows = getFiltered();
        const selected = currentFeedback(rows);
        renderChips();
        renderList(rows);
        renderDetail(selected);
      }

      /* ---------------------------------------------------------------
         事件
         --------------------------------------------------------------- */
      $('#feedback-chips').addEventListener('click', function (event) {
        const chip = event.target.closest('.chip[data-status]');
        if (!chip) return;
        state.status = chip.getAttribute('data-status');
        state.selectedId = null;
        renderAll();
      });

      $('#feedback-list').addEventListener('click', function (event) {
        const card = event.target.closest('.feedback-card');
        if (!card) return;
        state.selectedId = card.getAttribute('data-id');
        renderAll();
      });

      $('#refresh-btn').addEventListener('click', function () {
        renderAll();
        App.toast('反馈数据已刷新', 'success');
      });

      renderAll();
    })();
  </script>
</body>
</html>
