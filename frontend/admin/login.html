<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 · SDU Forum Admin</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="login-page">
  <div class="login-shell">
    <!-- 左侧品牌区 -->
    <aside class="login-brand">
      <div class="login-brand-inner">
        <div class="login-logo">
          <span class="brand-mark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
              <path d="M8.5 9.5h7"/>
              <path d="M8.5 12.5h4.5"/>
            </svg>
          </span>
          <div>
            <div class="name">SDU Forum</div>
            <div class="sub">Admin Console</div>
          </div>
        </div>

        <h1 class="login-headline">校园社区治理，<br>从<span>清晰的运营视图</span>开始</h1>
        <p class="login-desc">统一管理用户、内容与社区治理工单。为山东大学校园论坛的日常运营提供稳定、可追溯的管理能力。</p>

        <div class="login-features">
          <div class="login-feature">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
            权限分级与操作留痕，敏感操作全程审计
          </div>
          <div class="login-feature">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            1,286 位论坛用户与内容统一管理
          </div>
          <div class="login-feature">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3v18h18"/>
              <path d="m19 9-5 5-4-4-3 3"/>
            </svg>
            实时掌握社区活跃度与治理效率
          </div>
        </div>
      </div>

      <div class="login-brand-foot">© 2026 SDU Forum · 山东大学校园论坛管理后台</div>
    </aside>

    <!-- 右侧登录表单 -->
    <section class="login-form-side">
      <div class="login-card">
        <h2 class="login-title">管理员登录</h2>
        <p class="login-sub">使用管理员账号进入 SDU Forum 运营后台</p>

        <div class="login-hint">
          <svg class="icon icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          仅限管理员账号登录，普通用户请前往论坛前台
        </div>

        <form class="login-form" id="login-form" novalidate>
          <div class="field" id="account-field">
            <label class="label" for="account">管理员账号 / 学号</label>
            <div class="input-icon">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input class="control" id="account" name="account" type="text" placeholder="请输入管理员账号或学号" autocomplete="username" spellcheck="false">
            </div>
            <div class="error-text" hidden></div>
          </div>

          <div class="field" id="password-field">
            <label class="label" for="password">密码</label>
            <div class="input-suffix">
              <input class="control" id="password" name="password" type="password" placeholder="请输入登录密码" autocomplete="current-password">
              <button type="button" class="icon-btn" id="toggle-password" title="显示密码" aria-label="显示密码">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="error-text" hidden></div>
          </div>

          <div class="checkbox-row">
            <label class="checkbox-label">
              <input class="checkbox" type="checkbox" id="remember" checked>
              7 天内保持登录
            </label>
            <span class="login-link" id="forgot-password">忘记密码？</span>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="login-submit">登录管理后台</button>
        </form>

        <div class="login-hint" style="margin-top:20px;background:var(--bg-page);color:var(--text-2)">
          <svg class="icon icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          演示账号：admin　演示密码：admin123
        </div>

        <div class="login-note">
          <svg class="icon icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          登录行为将被记录并纳入操作日志审计
        </div>
      </div>
    </section>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      'use strict';

      const form = document.getElementById('login-form');
      const account = document.getElementById('account');
      const password = document.getElementById('password');
      const accountField = document.getElementById('account-field');
      const passwordField = document.getElementById('password-field');
      const submitBtn = document.getElementById('login-submit');
      const toggleBtn = document.getElementById('toggle-password');
      const remember = document.getElementById('remember');

      function showError(field, message) {
        field.classList.add('invalid');
        const tip = field.querySelector('.error-text');
        if (tip) {
          tip.textContent = message;
          tip.hidden = false;
        }
      }

      function clearError(field) {
        field.classList.remove('invalid');
        const tip = field.querySelector('.error-text');
        if (tip) {
          tip.hidden = true;
          tip.textContent = '';
        }
      }

      [account, password].forEach(function (input) {
        input.addEventListener('input', function () {
          clearError(input.closest('.field'));
        });
      });

      toggleBtn.addEventListener('click', function () {
        const isPassword = password.type === 'password';
        password.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword
          ? '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>'
          : '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
        toggleBtn.title = isPassword ? '隐藏密码' : '显示密码';
        toggleBtn.setAttribute('aria-label', toggleBtn.title);
        password.focus();
      });

      document.getElementById('forgot-password').addEventListener('click', function () {
        App.toast('请联系信息中心或超级管理员重置密码', 'info');
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        clearError(accountField);
        clearError(passwordField);

        let valid = true;
        if (!account.value.trim()) {
          showError(accountField, '请输入管理员账号或学号');
          valid = false;
        }
        if (!password.value) {
          showError(passwordField, '请输入登录密码');
          valid = false;
        } else if (password.value.length < 6) {
          showError(passwordField, '密码长度不少于 6 位');
          valid = false;
        }
        if (!valid) return;

        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        setTimeout(function () {
          const ok = account.value.trim() === 'admin' && password.value === 'admin123';
          if (ok) {
            try {
              localStorage.setItem('sdu-admin-session', JSON.stringify({
                account: account.value.trim(),
                loginAt: Date.now(),
                remember: remember.checked
              }));
            } catch (error) { /* 忽略存储异常 */ }
            App.toast('登录成功，正在进入管理控制台…', 'success', 1600);
            setTimeout(function () { window.location.href = 'index.html'; }, 600);
          } else {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
            showError(passwordField, '账号或密码不正确，请重新输入');
            App.toast('账号或密码不正确', 'error');
          }
        }, 900);
      });
    })();
  </script>
</body>
</html>
