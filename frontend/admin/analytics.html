<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据分析 · SDU Forum Admin</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main data-page="analytics">
    <!--
      ======================================================================
      页面：数据分析
      ----------------------------------------------------------------------
      数据字段（ANALYTICS）：
        daily[]：date / label / register / active / posts / comments / likes（180 天）
        categories[]：name / posts / comments / avgInteraction / delta
        retention{ 7|30|90 }：current / previous（次月留存率）
      关联数据：USERS（活跃用户 TOP10）
      ----------------------------------------------------------------------
      后端接口草案：
        GET /api/admin/analytics/overview?days=30&compare=1
        GET /api/admin/analytics/categories?days=30
        GET /api/admin/analytics/retention?days=30
        GET /api/admin/analytics/active-users?limit=10
      ======================================================================
    -->
    <div class="page-head">
      <div class="page-head-titles">
        <h1 class="page-title">数据分析</h1>
        <p class="page-desc">社区成员增长、内容互动与留存情况的全景概览</p>
      </div>
    </div>

    <div class="ana-toolbar">
      <div class="segmented-wrap">
        <span class="segmented-label">时间范围</span>
        <div class="segmented" id="ana-range" role="group" aria-label="时间范围">
          <button type="button" data-days="7">近 7 天</button>
          <button type="button" data-days="30" class="active">近 30 天</button>
          <button type="button" data-days="90">近 90 天</button>
        </div>
      </div>
      <div class="ana-toolbar-side">
        <label class="ana-compare">
          <span>对比上期</span>
          <span class="switch"><input type="checkbox" id="ana-compare" checked><span class="switch-track"></span></span>
        </label>
        <span class="ana-inline-note" id="ana-updated"></span>
      </div>
    </div>

    <div class="kpi-grid ana-kpis" id="ana-kpis"></div>

    <div class="ana-grid">
      <div class="card ana-chart-card">
        <div class="card-head">
          <div>
            <div class="card-title">成员增长</div>
            <div class="card-sub">每日新增注册与活跃成员走势</div>
          </div>
          <div class="card-head-side">
            <div class="ana-legend" id="line-legend"></div>
          </div>
        </div>
        <div class="card-body">
          <div class="ana-chart-wrap" id="ana-line"></div>
        </div>
      </div>

      <div class="card ana-chart-card">
        <div class="card-head">
          <div>
            <div class="card-title">留存分析</div>
            <div class="card-sub">注册后次月仍活跃的用户占比</div>
          </div>
        </div>
        <div class="card-body">
          <div class="ana-retention-body">
            <div id="ana-donut"></div>
            <div class="ana-retention-stats" id="ana-retention-stats"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card ana-chart-card" style="margin-bottom:16px">
      <div class="card-head">
        <div>
          <div class="card-title">内容互动</div>
          <div class="card-sub">按分类统计发帖与评论数量</div>
        </div>
        <div class="card-head-side">
          <div class="ana-legend" id="bar-legend"></div>
        </div>
      </div>
      <div class="card-body">
        <div class="ana-chart-wrap" id="ana-bar"></div>
      </div>
    </div>

    <div class="ana-tables">
      <div class="card ana-table-card">
        <div class="card-head">
          <div>
            <div class="card-title">各分类内容表现</div>
            <div class="card-sub">帖子规模、平均互动与环比变化</div>
          </div>
        </div>
        <div class="card-body"><div id="ana-cat-table"></div></div>
      </div>

      <div class="card ana-table-card">
        <div class="card-head">
          <div>
            <div class="card-title">活跃用户 TOP10</div>
            <div class="card-sub">按发帖与互动综合活跃度排序</div>
          </div>
        </div>
        <div class="card-body"><div id="ana-user-table"></div></div>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/mock.js"></script>
  <script src="assets/charts.js"></script>
  <script>
    (function () {
      'use strict';

      const App = window.App;
      App.renderLayout('analytics');

      const $ = App.$;
      const $$ = App.$$;
      const esc = App.escapeHtml;
      const DATA = window.ANALYTICS;
      const USERS = window.USERS;

      const CATEGORY_COLORS = ['#1E5BB8', '#0F766E', '#B45309', '#7C3AED', '#BE123C'];

      const state = { days: 30, compare: true };

      function sum(list, key) {
        return list.reduce(function (total, item) { return total + (Number(item[key]) || 0); }, 0);
      }

      function avg(list, key) {
        return list.length ? sum(list, key) / list.length : 0;
      }

      function rate(list) {
        const active = sum(list, 'active');
        return active ? (sum(list, 'comments') + sum(list, 'likes')) / active * 100 : 0;
      }

      function percentChange(current, previous) {
        if (!previous) return 0;
        return (current - previous) / previous * 100;
      }

      function sliceDays(days, offset) {
        const end = DATA.daily.length - offset * days;
        return DATA.daily.slice(Math.max(0, end - days), end);
      }

      /* ---------------------------------------------------------------
         KPI
         --------------------------------------------------------------- */
      function kpiCard(opts) {
        return '<div class="card kpi-card">' +
          '<div class="kpi-top"><div class="kpi-label">' + opts.icon + esc(opts.label) + '</div>' +
          '<div class="kpi-icon" style="background:' + opts.bg + ';color:' + opts.fg + '">' + App.icon(opts.iconName, 18) + '</div></div>' +
          '<div class="kpi-value">' + opts.value + '</div>' +
          '<div class="ana-kpi-foot">' +
          '<div class="ana-kpi-meta">' +
          '<div class="kpi-foot">' + deltaHTML(opts.delta) + '</div>' +
          '<div class="kpi-foot">' + esc(opts.foot) + '</div>' +
          '</div>' +
          '<div class="ana-spark" id="' + opts.sparkId + '"></div>' +
          '</div></div>';
      }

      function deltaHTML(value) {
        if (!state.compare) return '<span class="text-sm muted">环比对比已关闭</span>';
        const up = value >= 0;
        return '<span class="delta ' + (up ? 'up' : 'down') + '">' + (up ? '↑' : '↓') + ' ' +
          Math.abs(value).toFixed(1) + '%</span><span>较上期</span>';
      }

      function renderKpis() {
        const current = sliceDays(state.days, 0);
        const previous = sliceDays(state.days, 1);

        const activeNow = avg(current, 'active');
        const activePrev = avg(previous, 'active');
        const registerNow = sum(current, 'register');
        const registerPrev = sum(previous, 'register');
        const postsNow = sum(current, 'posts');
        const postsPrev = sum(previous, 'posts');
        const rateNow = rate(current);
        const ratePrev = rate(previous);

        $('#ana-kpis').innerHTML =
          kpiCard({
            label: '活跃成员', icon: App.icon('users', 14), iconName: 'users',
            bg: 'var(--primary-soft)', fg: 'var(--primary)',
            value: App.fmtNum(Math.round(activeNow)),
            delta: percentChange(activeNow, activePrev),
            foot: '近 ' + state.days + ' 天日均活跃',
            sparkId: 'ana-spark-active'
          }) +
          kpiCard({
            label: '新增成员', icon: App.icon('user-check', 14), iconName: 'user-check',
            bg: 'var(--success-soft)', fg: 'var(--success-text)',
            value: App.fmtNum(registerNow),
            delta: percentChange(registerNow, registerPrev),
            foot: '区间累计注册人数',
            sparkId: 'ana-spark-register'
          }) +
          kpiCard({
            label: '发帖量', icon: App.icon('file-text', 14), iconName: 'file-text',
            bg: 'var(--warning-soft)', fg: 'var(--warning-text)',
            value: App.fmtNum(postsNow),
            delta: percentChange(postsNow, postsPrev),
            foot: '区间内新发布帖子',
            sparkId: 'ana-spark-posts'
          }) +
          kpiCard({
            label: '互动率', icon: App.icon('heart', 14), iconName: 'heart',
            bg: 'var(--info-soft)', fg: 'var(--info-text)',
            value: rateNow.toFixed(1) + '%',
            delta: percentChange(rateNow, ratePrev),
            foot: '（评论 + 点赞）/ 活跃成员',
            sparkId: 'ana-spark-rate'
          });

        window.Charts.sparkline('#ana-spark-active', {
          data: current.map(function (item) { return item.active; }),
          color: 'var(--primary)', width: 92, height: 30
        });
        window.Charts.sparkline('#ana-spark-register', {
          data: current.map(function (item) { return item.register; }),
          color: 'var(--success)', width: 92, height: 30
        });
        window.Charts.sparkline('#ana-spark-posts', {
          data: current.map(function (item) { return item.posts; }),
          color: 'var(--warning)', width: 92, height: 30
        });
        window.Charts.sparkline('#ana-spark-rate', {
          data: current.map(function (item) { return item.active ? (item.comments + item.likes) / item.active * 100 : 0; }),
          color: 'var(--info)', width: 92, height: 30
        });
      }

      /* ---------------------------------------------------------------
         图表
         --------------------------------------------------------------- */
      function legendHTML(items) {
        return items.map(function (item) {
          return '<span><i style="background:' + item.color + '"></i>' + esc(item.name) + '</span>';
        }).join('');
      }

      function renderCharts() {
        const current = sliceDays(state.days, 0);
        const previous = sliceDays(state.days, 1);
        const labels = current.map(function (item) { return item.label; });

        const series = [
          { name: '注册数', color: 'var(--primary)', data: current.map(function (item) { return item.register; }) },
          { name: '活跃数', color: '#10B981', data: current.map(function (item) { return item.active; }) }
        ];
        if (state.compare) {
          series.push({ name: '上期注册数', color: '#93C5FD', area: false, data: previous.map(function (item) { return item.register; }) });
          series.push({ name: '上期活跃数', color: '#6EE7B7', area: false, data: previous.map(function (item) { return item.active; }) });
        }

        $('#line-legend').innerHTML = legendHTML(series.map(function (item) {
          return { name: item.name, color: item.color };
        }));
        window.Charts.line('#ana-line', { labels: labels, series: series, height: 280 });

        const barSeries = [
          { name: '发帖', color: 'var(--primary)', data: DATA.categories.map(function (item) { return item.posts; }) },
          { name: '评论', color: '#93C5FD', data: DATA.categories.map(function (item) { return item.comments; }) }
        ];
        $('#bar-legend').innerHTML = legendHTML(barSeries.map(function (item) {
          return { name: item.name, color: item.color };
        }));
        window.Charts.bar('#ana-bar', {
          labels: DATA.categories.map(function (item) { return item.name; }),
          series: barSeries,
          stacked: true,
          height: 280
        });

        const retention = DATA.retention[state.days];
        window.Charts.donut('#ana-donut', {
          segments: [
            { label: '次月留存', value: retention.current, color: 'var(--primary)' },
            { label: '未留存', value: Number((100 - retention.current).toFixed(1)), color: '#E2E8F0' }
          ],
          size: 156,
          thickness: 18,
          centerValue: retention.current.toFixed(1) + '%',
          centerLabel: '次月留存率',
          legend: false
        });

        const diff = percentChange(retention.current, retention.previous);
        $('#ana-retention-stats').innerHTML =
          '<div class="ana-retention-row"><span>本期留存率</span><b>' + retention.current.toFixed(1) + '%</b></div>' +
          '<div class="ana-retention-row"><span>上期留存率</span><b>' + retention.previous.toFixed(1) + '%</b></div>' +
          '<div class="ana-retention-row"><span>环比变化</span><span class="delta ' + (diff >= 0 ? 'up' : 'down') + '">' +
          (diff >= 0 ? '↑' : '↓') + ' ' + Math.abs(diff).toFixed(1) + '%</span></div>';
      }

      /* ---------------------------------------------------------------
         表格
         --------------------------------------------------------------- */
      function renderTables() {
        const factor = state.days / 30;

        App.renderTable('#ana-cat-table', [
          {
            title: '分类',
            cell: function (item, index) {
              return '<div class="ana-cat-name"><i style="background:' + CATEGORY_COLORS[index % CATEGORY_COLORS.length] + '"></i>' +
                esc(item.name) + '</div>';
            }
          },
          {
            title: '帖子数', width: '92px', align: 'right',
            cell: function (item) {
              return '<span class="ana-num">' + App.fmtNum(Math.round(item.posts * factor)) + '</span>';
            }
          },
          {
            title: '平均互动', width: '96px', align: 'right',
            cell: function (item) {
              return '<span class="ana-num">' + item.avgInteraction.toFixed(1) + '</span>';
            }
          },
          {
            title: '环比', width: '88px', align: 'right',
            cell: function (item) {
              const up = item.delta >= 0;
              return '<span class="delta ' + (up ? 'up' : 'down') + '">' + (up ? '↑' : '↓') + ' ' +
                Math.abs(item.delta).toFixed(1) + '%</span>';
            }
          }
        ], DATA.categories, {
          emptyText: '暂无分类数据',
          emptyDesc: '待内容积累后可查看分类表现',
          emptyIcon: 'chart'
        });

        const topUsers = USERS.slice()
          .sort(function (a, b) {
            const scoreA = a.postCount * 3 + a.commentCount * 1.5 + (a.lastActiveAt >= Date.now() - 7 * 86400000 ? 120 : 0);
            const scoreB = b.postCount * 3 + b.commentCount * 1.5 + (b.lastActiveAt >= Date.now() - 7 * 86400000 ? 120 : 0);
            return scoreB - scoreA;
          })
          .slice(0, 10);

        App.renderTable('#ana-user-table', [
          {
            title: '排名', width: '56px',
            cell: function (item, index) {
              return '<span class="rank-num' + (index < 3 ? ' top-' + (index + 1) : '') + '">' + (index + 1) + '</span>';
            }
          },
          {
            title: '用户',
            cell: function (item) {
              return '<div class="ana-user">' + App.avatarHTML(item.nickname, item.id, 28) +
                '<div style="min-width:0"><div class="ana-user-name">' + esc(item.nickname) + '</div>' +
                '<div class="ana-user-meta">' + esc(item.studentId) + ' · ' + esc(item.college) + '</div></div></div>';
            }
          },
          {
            title: '发帖', width: '58px', align: 'right',
            cell: function (item) { return '<span class="ana-num">' + item.postCount + '</span>'; }
          },
          {
            title: '评论', width: '58px', align: 'right',
            cell: function (item) { return '<span class="ana-num">' + App.fmtNum(item.commentCount) + '</span>'; }
          },
          {
            title: '最后活跃', width: '92px', align: 'right',
            cell: function (item) { return '<span class="text-sm muted">' + App.fmtRelative(item.lastActiveAt) + '</span>'; }
          }
        ], topUsers, {
          emptyText: '暂无活跃用户',
          emptyDesc: '社区成员活跃后将在这里展示',
          emptyIcon: 'users'
        });
      }

      /* ---------------------------------------------------------------
         渲染入口
         --------------------------------------------------------------- */
      function renderAll() {
        renderKpis();
        renderCharts();
        renderTables();
        $('#ana-updated').textContent = '数据更新于 ' + App.fmtDate(Date.now(), 'HH:mm');
      }

      /* ---------------------------------------------------------------
         事件
         --------------------------------------------------------------- */
      $('#ana-range').addEventListener('click', function (event) {
        const button = event.target.closest('button[data-days]');
        if (!button) return;
        state.days = Number(button.getAttribute('data-days'));
        $$('#ana-range button').forEach(function (item) { item.classList.toggle('active', item === button); });
        renderAll();
      });

      $('#ana-compare').addEventListener('change', function () {
        state.compare = this.checked;
        renderAll();
      });

      window.addEventListener('resize', App.debounce(function () {
        renderCharts();
      }, 220));

      renderAll();
    })();
  </script>
</body>
</html>
